bundle:
  name: job-export-gold

include:
  - resources/workflows/workflow_dm_export_gold.yml

artifacts:
  dm_export_gold:
    type: whl
    path: ./src/batch/dm_export_gold

variables:
  catalog:
    description: "Unity Catalog name"
    default: "dev"
  ingestion_s3_bucket:
    description: "S3 bucket for ingestion/exports"
    default: "dm-chain-explorer-dev-ingestion"

targets:
  dev:
    # T-R.2 F-09 (AC-19): every target runs as the service principal, never
    # a personal identity — dev/hml previously deployed as whoever held the
    # PAT, the exact coupling C3 set out to remove.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    presets:
      name_prefix: "[dev] "
    workspace:
      # host: resolved from the DATABRICKS_HOST env var at validate/deploy
      # time (CLI 0.270 does not support variable interpolation on this
      # authentication field). Set it to the Free-Edition workspace URL.
      root_path: "~/.bundle/${bundle.name}/dev"
    variables:
      catalog: "dev"
      ingestion_s3_bucket: "dm-chain-explorer-dev-ingestion"

  hml:
    # T-R.2 F-09 (AC-19): every target runs as the service principal, never
    # a personal identity — dev/hml previously deployed as whoever held the
    # PAT, the exact coupling C3 set out to remove.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    presets:
      name_prefix: "[hml] "
    workspace:
      # host: resolved from the DATABRICKS_HOST env var at validate/deploy
      # time (CLI 0.270 does not support variable interpolation on this
      # authentication field). Set it to the Free-Edition workspace URL.
      root_path: "~/.bundle/${bundle.name}/hml"
    variables:
      catalog: "hml"
      ingestion_s3_bucket: "dm-chain-explorer-hml-lakehouse"

  prod:
    mode: production
    # prod runs as the dm_spn_user service principal (never a personal
    # identity) — dev/hml deploy interactively as the operator.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    workspace:
      # host: intentionally unset. Resolved from DATABRICKS_HOST at
      # runtime; no value is provided anywhere in this bundle because no
      # prod Databricks workspace exists yet (ADR-002) — `validate -t
      # prod` must fail without an explicit DATABRICKS_HOST export.
      root_path: "/Workspace/.bundle/${bundle.name}/prod"
    variables:
      catalog: "prd"
      ingestion_s3_bucket: "dm-chain-explorer-prd-lakehouse"
