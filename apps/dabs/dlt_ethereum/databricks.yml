bundle:
  name: dlt-ethereum

include:
  - resources/dlt/pipeline_ethereum.yml
  - resources/workflows/workflow_trigger_ethereum.yml

variables:
  catalog:
    description: "Unity Catalog name"
    default: "dev"
  ingestion_s3_bucket:
    description: "S3 bucket for ingestion"
    default: "dm-chain-explorer-dev-ingestion"
  dlt_development:
    description: "DLT development mode"
    default: true
  dlt_continuous:
    description: "DLT continuous mode"
    default: false

targets:
  dev:
    # T-R.2 F-09 (AC-19): dev runs as the Free-Edition service principal
    # (dm_spn_user), never a personal identity — even when the operator
    # deploys interactively.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    presets:
      name_prefix: "[dev] "
    workspace:
      # host: resolved from the DATABRICKS_HOST env var at validate/deploy
      # time (CLI 0.270 does not support variable interpolation on this
      # authentication field). dev = the Free-Edition workspace URL.
      root_path: "~/.bundle/${bundle.name}/dev"
    variables:
      catalog: "dev"
      ingestion_s3_bucket: "dm-chain-explorer-dev-ingestion"
      dlt_development: true
      dlt_continuous: false
    resources:
      pipelines:
        pipeline_ethereum:
          development: true
      jobs:
        workflow_trigger_ethereum:
          # Platform parked — no data has flowed since capture retirement
          # (v0.4.0); dd-chain-capture is not yet delivering. Unpause once
          # raw/mainnet-*-data lands again in dm-chain-explorer-dev-ingestion.
          schedule:
            quartz_cron_expression: "0 */5 * * * ?"
            timezone_id: "UTC"
            pause_status: PAUSED

  prod:
    mode: production
    # No run_as: prod is deployed ONLY by CI, authenticated as the production
    # workspace's own service principal (OAuth M2M, `production` GitHub
    # environment). A service-principal deployer is the run_as identity by
    # definition (production-mode rules), so no application id of any
    # workspace is written here.
    workspace:
      # host: resolved from DATABRICKS_HOST at validate/deploy time — the
      # production workspace URL (official account), an environment secret.
      root_path: "/Workspace/.bundle/${bundle.name}/prod"
    variables:
      catalog: "prd"
      ingestion_s3_bucket: "dm-chain-explorer-lakehouse"
      dlt_development: false
      dlt_continuous: false
    resources:
      jobs:
        workflow_trigger_ethereum:
          # Platform parked in prod as well — dd-chain-capture is not yet
          # delivering to the production bucket. Unpause once raw data lands.
          schedule:
            quartz_cron_expression: "0 */5 * * * ?"
            timezone_id: "UTC"
            pause_status: PAUSED
