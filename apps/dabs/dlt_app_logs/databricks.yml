bundle:
  name: dlt-app-logs

include:
  - resources/dlt/pipeline_app_logs.yml
  - resources/workflows/workflow_trigger_app_logs.yml

variables:
  catalog:
    description: "Unity Catalog name"
    default: "dev"
  ingestion_s3_bucket:
    description: "S3 bucket for ingestion"
    default: "dm-chain-explorer-dev-ingestion"
  dlt_development:
    description: "DLT development mode"
    default: true
  dlt_continuous:
    description: "DLT continuous mode"
    default: false
  streaming_logger_names:
    description: >-
      Comma-separated `logger` field values routed to s_logs.logs_streaming.
      dd-chain-capture (external project) owns the real producer names —
      override once Fluent-Bit traffic confirms them.
    default: "MINED_BLOCKS_EVENTS,ORPHAN_BLOCKS_CRAWLER,BLOCK_DATA_CRAWLER,RAW_TXS_CRAWLER,TRANSACTION_INPUT_DECODER"
  batch_logger_names:
    description: "Comma-separated `logger` field values routed to s_logs.logs_batch."
    default: "CONTRACT_TRANSACTIONS_CRAWLER"

targets:
  dev:
    # T-R.2 F-09 (AC-19): every target runs as the service principal, never
    # a personal identity — dev/hml previously deployed as whoever held the
    # PAT, the exact coupling C3 set out to remove.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    presets:
      name_prefix: "[dev] "
    workspace:
      # host: resolved from the DATABRICKS_HOST env var at validate/deploy
      # time (CLI 0.270 does not support variable interpolation on this
      # authentication field). Set it to the Free-Edition workspace URL.
      root_path: "~/.bundle/${bundle.name}/dev"
    variables:
      catalog: "dev"
      ingestion_s3_bucket: "dm-chain-explorer-dev-ingestion"
      dlt_development: true
      dlt_continuous: false
    resources:
      pipelines:
        pipeline_app_logs:
          development: true
      jobs:
        workflow_trigger_app_logs:
          # Platform parked — no data has flowed since capture retirement
          # (v0.4.0); the Fluent-Bit NDJSON reader has never been deployed
          # against live traffic. Unpause once raw/app_logs/*.ndjson lands.
          schedule:
            quartz_cron_expression: "0 2/3 * * * ?"
            timezone_id: "UTC"
            pause_status: PAUSED

  hml:
    # T-R.2 F-09 (AC-19): every target runs as the service principal, never
    # a personal identity — dev/hml previously deployed as whoever held the
    # PAT, the exact coupling C3 set out to remove.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    presets:
      name_prefix: "[hml] "
    workspace:
      # host: resolved from the DATABRICKS_HOST env var at validate/deploy
      # time (CLI 0.270 does not support variable interpolation on this
      # authentication field). Set it to the Free-Edition workspace URL.
      root_path: "~/.bundle/${bundle.name}/hml"
    variables:
      catalog: "hml"
      ingestion_s3_bucket: "dm-chain-explorer-hml-lakehouse"
      dlt_development: false
      dlt_continuous: false
    resources:
      pipelines:
        pipeline_app_logs:
          development: false
      jobs:
        workflow_trigger_app_logs:
          # Platform parked — hml has no ingested data. Unpause once
          # dd-chain-capture delivers app logs to hml.
          schedule:
            quartz_cron_expression: "0 2/3 * * * ?"
            timezone_id: "UTC"
            pause_status: PAUSED

  prod:
    mode: production
    # prod runs as the dm_spn_user service principal (never a personal
    # identity) — dev/hml deploy interactively as the operator.
    run_as:
      service_principal_name: "02d610ae-7682-4f91-9053-4f7ed6880d96"
    workspace:
      # host: intentionally unset. Resolved from DATABRICKS_HOST at
      # runtime; no value is provided anywhere in this bundle because no
      # prod Databricks workspace exists yet (ADR-002) — `validate -t
      # prod` must fail without an explicit DATABRICKS_HOST export.
      root_path: "/Workspace/.bundle/${bundle.name}/prod"
    variables:
      catalog: "prd"
      ingestion_s3_bucket: "dm-chain-explorer-lakehouse"
      dlt_development: false
      dlt_continuous: false
    # No trigger-job schedule override here: prod is not a deployed target in
    # this release (no prod Databricks workspace exists — ADR-002); the host
    # guard (T-C.3) makes `validate -t prod` fail unless DATABRICKS_HOST is set.
